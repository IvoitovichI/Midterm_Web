name: space-bounty-midterm
services:
  backend:
    build: .
    ports:
      - "${APP_PORT:-8081}:8080"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-space_bounty}
      DB_USER: ${POSTGRES_USER:-bounty}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-bounty_local_dev}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-space_bounty}
      POSTGRES_USER: ${POSTGRES_USER:-bounty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bounty_local_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres-data:
