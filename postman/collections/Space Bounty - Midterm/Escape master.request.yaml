$kind: http-request
url: "{{baseUrl}}/api/criminals/?escape_master=true"
method: GET
queryParams:
  escape_master: "true"
scripts:
  - type: afterResponse
    code: |-
      (() => {
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      const data = pm.response.json();
      const expected = JSON.parse(pm.collectionVariables.get("allCriminals")).filter(c => c.escape_master === true);
      pm.test('Exact matching set', () => pm.expect(data.map(c => c.id).sort((a,b)=>a-b)).to.eql(expected.map(c => c.id).sort((a,b)=>a-b)));
      })();
    language: text/javascript
settings: {}
order: 8000
