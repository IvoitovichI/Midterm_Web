$kind: http-request
url: "{{baseUrl}}/api/hunts/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"criminal_id": 1, "success": "false", "notes": "Invalid"}'
scripts:
  - type: afterResponse
    code: |-
      (() => {
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      const data = pm.response.json();
      pm.test('JSON error message', () => pm.expect(data.error).to.be.a('string').and.not.empty);
      })();
    language: text/javascript
settings: {}
order: 25000
