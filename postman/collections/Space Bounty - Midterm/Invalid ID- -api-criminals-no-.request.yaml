$kind: http-request
name: "Invalid ID: /api/criminals/no/"
url: "{{baseUrl}}/api/criminals/no/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      (() => {
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      const data = pm.response.json();
      pm.test('JSON error message', () => pm.expect(data.error).to.be.a('string').and.not.empty);
      })();
    language: text/javascript
settings: {}
order: 50000
